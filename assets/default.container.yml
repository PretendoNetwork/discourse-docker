# Basics for web_only
templates:
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  - "templates/recursive-ip.template.yml"

params:
  version: v2026.7.1

hooks:
  after_code:
    # Install plugins
    - exec:
        cd: $home/plugins
        cmd: [] # Add git clones here for plugins
      
    # Uninstall pg15, replace it with pg17 
    - exec: DEBIAN_FRONTEND=noninteractive apt-get purge -y postgresql-client-15
    - exec: apt-get update && apt-get install -y postgresql-client-17

    # Update nginx
    - exec: curl https://nginx.org/keys/nginx_signing.key | gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
    - exec: echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/debian trixie nginx" > /etc/apt/sources.list.d/nginx.list
    - exec: apt-get update && apt-get install -y nginx=1.31.9-1~trixie
